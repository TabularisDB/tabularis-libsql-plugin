[package]
name = "libsql-plugin"
version = "0.1.0"
edition = "2021"
description = "Tabularis driver plugin for libSQL / Turso (local files and remote Hrana-over-HTTP)"
license = "Apache-2.0"
publish = false

[lib]
name = "libsql_plugin"
path = "src/lib.rs"

[[bin]]
name = "libsql-plugin"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# Local file backend: bundled SQLite, compiled from source -> no system lib
# needed, builds identically on Linux, macOS and Windows.
rusqlite = { version = "0.31", features = ["bundled"] }
# Remote backend: blocking HTTP client with pure-Rust rustls TLS (no OpenSSL),
# used to speak the Hrana-over-HTTP pipeline protocol to Turso / sqld.
ureq = { version = "2", features = ["json"] }
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
